name: Recordings

# Records each agent x backend combination with asciinema and publishes
# the player site to GitHub Pages. Manual trigger only: every run spends
# real API credits. Required repo secrets: OPENROUTER_API_KEY,
# ANTHROPIC_API_KEY, GEMINI_API_KEY. Optional: OPENAI_API_KEY (codex is
# skipped without it).

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recordings
  cancel-in-progress: false

jobs:
  record:
    name: Record / ${{ matrix.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [bwrap, runsc, microvm, microvm-runsc]
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      # Recording builds several agent closures on the runner; the stock
      # image does not leave enough free disk for it.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Ubuntu 24.04 confines unprivileged user namespaces behind
      # AppArmor; bwrap and rootless runsc need them.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14  # v14

      - name: Record ${{ matrix.backend }}
        run: |
          nix shell nixpkgs#asciinema nixpkgs#tmux --command \
            scripts/record-agents.sh "${{ matrix.backend }}" /tmp/recordings/casts

      - name: Upload casts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: casts-${{ matrix.backend }}
          path: /tmp/recordings/casts/*.cast
          if-no-files-found: warn

  site:
    name: Publish site
    runs-on: ubuntu-latest
    needs: record
    # Publish whatever was recorded; the site renders placeholders for
    # missing agent/backend combinations.
    if: always()
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          pattern: casts-*
          path: /tmp/recordings/casts
          merge-multiple: true

      - name: Build site
        run: scripts/build-recordings-site.sh /tmp/recordings

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: /tmp/recordings

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
