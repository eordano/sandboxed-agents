name: Auto-update branch

on:
  schedule:
    - cron: '0 5,17 * * *'
  workflow_dispatch:

concurrency:
  group: auto-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh auto-update
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
      - uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Run every updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          failed=""
          for agent in claude hermes opencode codex gemini; do
            echo "=== $agent ==="
            nix run ".#update-$agent" || failed="$failed $agent"
          done
          if [ -n "$failed" ]; then
            echo "::error::updaters failed:$failed"
            exit 1
          fi

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No pin moved; auto-update will be re-pointed at main as-is."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat
          fi

      - name: Build the agents with the new pins
        if: steps.diff.outputs.changed == 'true'
        run: |
          nix build .#claude .#hermes .#opencode .#codex .#gemini \
            --no-link --print-build-logs
          for agent in claude hermes opencode codex gemini; do
            nix build ".#$agent-bwrap" ".#$agent-microvm" --no-link --dry-run
          done

      - name: Commit the new pins
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "auto: refresh agent pins ($(date -u +%Y-%m-%d))"

      - name: Force-push auto-update
        run: git push origin HEAD:refs/heads/auto-update --force
