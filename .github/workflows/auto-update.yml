name: Auto-update branch

# Every 12 hours, rebuild `auto-update` as main + the newest upstream pins.
# No PR and no issue: the branch is force-pushed and consumers track it
# directly. `update.yml` remains the reviewed path into main; this is the
# unreviewed one, gated on the six agents still building.
#
# The branch is re-pushed even when no pin moved, so it keeps up with main
# rather than pinning whatever main looked like the last time an agent
# happened to release. That case needs no build gate: it is main verbatim,
# which ci.yml has already checked.

on:
  schedule:
    - cron: '0 5,17 * * *'   # 05:00 and 17:00 UTC, an hour off update.yml
  workflow_dispatch:

concurrency:
  group: auto-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh auto-update
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: main
      - uses: DeterminateSystems/nix-installer-action@da36cb69b1c3247ad7a1f931ebfd954a1105ef14  # v14

      # Six agent closures do not fit next to the runner image's preinstalled
      # toolchains -- same reason ci.yml and recordings.yml free space first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      # A silently-skipped updater is the failure this job is most likely to
      # hit: lib/update.sh reads the GitHub releases API, and unauthenticated
      # calls from Actions runners get rate-limited per shared IP. Pass the
      # token, and fail loudly rather than reporting "already up to date".
      - name: Run every updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          failed=""
          for agent in claude hermes opencode codex gemini aider; do
            echo "=== $agent ==="
            nix run ".#update-$agent" || failed="$failed $agent"
          done
          if [ -n "$failed" ]; then
            echo "::error::updaters failed:$failed"
            exit 1
          fi

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No pin moved; auto-update will be re-pointed at main as-is."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat
          fi

      # A broken auto-update branch is worse than a stale one. The six default
      # variants get a real build; the bwrap and microvm variants get an
      # evaluation, which is what catches a pin that breaks their derivations
      # without paying for twelve more closures.
      - name: Build the agents with the new pins
        if: steps.diff.outputs.changed == 'true'
        run: |
          nix build .#claude .#hermes .#opencode .#codex .#gemini .#aider \
            --no-link --print-build-logs
          for agent in claude hermes opencode codex gemini aider; do
            nix build ".#$agent-bwrap" ".#$agent-microvm" --no-link --dry-run
          done

      - name: Commit the new pins
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "auto: refresh agent pins ($(date -u +%Y-%m-%d))"

      - name: Force-push auto-update
        run: git push origin HEAD:refs/heads/auto-update --force
